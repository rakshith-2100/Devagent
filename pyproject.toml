[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.1.0"
description = "A terminal coding agent that edits code in an isolated git worktree, asks before anything irreversible, and records everything it does."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.scripts]
devagent = "devagent.__main__:main"

[tool.setuptools.packages.find]
include = ["devagent*"]

[tool.setuptools.package-data]
devagent = ["prompts/*.md", "evals/cases/*.yaml", "evals/fixtures/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
